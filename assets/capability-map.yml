schema_version: 2

# Provenance for a follow-on agent: everything needed to know what this run
# was, and whether another run is comparable to it. Required in the JSON
# and in the report's measurement section.
provenance:
  report_schema_version: 2
  skill_version: null       # the skill's released version or commit
  adapter_versions: {}      # adapter name -> version or commit
  profile_registry_sources: [] # ordered [{path, sha256}] executable profile inputs
  generated_at: null        # ISO 8601
  repo_ref: null            # commit ref of the audited repository
  validation_gate:          # stamped ONLY by `tools/validate_run.py --stamp` on a passing run —
    passed: false           # never hand-set this true; it is the one field a report generator
    exit_code: null         # must not write itself. false/null here means the 17-rule gate has
    checked_at: null        # not (yet) passed against this exact report, whatever else it claims.

# What owns theming, and what the project actually authored. Read from
# the repository in Stage 1, before anything below this block is graded —
# see references/discovery.md.
discovery:
  engine:                    # the deterministic discovery implementation
    name: null               # universal-profile-engine
    schema_version: null
  repository:                # audited checkout identity used for provenance validation
    root: null
    ref: null
  environment: []          # one or more active profile ids; unknown only when none match
  adapters: []             # adapter references contributed by active profiles
  detected_by: []          # evidence for each detected layer
  confidence: []           # evidence confidence per layer
  evidence: []             # each entry: {claim, kind, path, line, matched, method, confidence, reachable_from, artifact_needed}
                           # build-config | lockfile | asset-registration | entry-point |
                           # template | theme-structure | extension
  ownership:               # the explicit or profile-inferred grading boundary
    owned_patterns: []
    basis: null
    inferred_owned_roots: []
    inferred_owned_patterns: []
    unknown_roots: []
    demo_roots: []

  # What discovery could establish independently of any one framework.
  # state: verified | unmeasured | blocked
  capabilities:
    detection: null
    production_roots: null
    import_resolution: null
    token_source_discovery: null
    ownership: null
    mode_resolution: null
    runtime_verification: null

  # Profiles compose rather than compete. A Discourse monorepo can retain
  # discourse, rails-sprockets, Storybook and monorepo evidence in one run.
  profile_composition:
    schema_version: 1
    registry: assets/framework-profiles.json
    registry_sources: []   # ordered [{path, sha256}], including custom overrides
    active: []             # [{id, kind, adapter, activation, confidence, score, evidence, missing_signals, contexts}]
    candidates: []         # partial matches retained for investigation
    order: []              # deterministic contribution order
    application_candidates: []
    embedded_applications: [] # nested framework applications composed with the root
    application_selection: # {requested, selected, state, reason}
      requested: null
      selected: null
      state: null
      reason: null
    conflicts: []
  profile_guidance: {}     # active profile -> guidance for capabilities 2-7

  # The same seven capabilities in their required order. Each step carries
  # state, contributors, evidence, the current limitation and one next move.
  capability_ladder:
    order: []
    steps: []              # [{capability, state, contributors, evidence, limitation, next_step}]

  # Every candidate found in job two, after job three proved reachability
  # and job four classified it. The token count counts concepts, so a
  # projection pair (a SCSS variable and the custom property it emits) is
  # one entry with both sites recorded in `sites`.
  # Each entry:
  #   {path, classification, reachable_from: [...], sites: [...],
  #    alias_of: <path|null>, matched: <what identified it>,
  #    confidence: framework-registered | import-graph verified |
  #                static candidate | runtime verified | blocked}
  # classification: canonical | alias | consumer | generated | unverified
  # A canonical or alias source with an empty reachable_from fails
  # validate_run.py rule 2 — it was inventoried without proof that it ships.
  token_sources: []

  # The output of tools/import_graph.py, carried into the report as
  # evidence. Roots are the owned production entry points; orphans are
  # stylesheets no root reaches.
  import_graph:
    roots: []              # each entry: {path, root_type, detected_by, evidence, confidence}
    reachable: {}          # path -> {depth, via: [...]}
    unresolved: []         # each entry: {from, spec, reason}
    orphans: []            # stylesheets no owned entry point reaches

  # Product roots proven by a framework registration or import graph.
  roots: []                # [{path, root_type, confidence, ownership, evidence, profiles}]

  # Static conventions retained as leads because no registered root proved
  # them reachable. They are never token-source evidence by themselves.
  root_candidates: []      # [{path, root_type, confidence, ownership, evidence, profiles}]

  # The same graph restricted to roots proven owned. Leakage and adoption
  # use this graph; import_graph above preserves the full framework picture.
  owned_import_graph:
    roots: []
    reachable: {}
    unresolved: []
    orphans: []

  # Optional framework-adapter roots used for component adoption analysis.
  # Strings are intentionally rejected: every root needs evidence.
  component_roots: []      # [{path, confidence, ownership, evidence, profiles}]
                            # confidence: framework-registered |
                            #             import-graph verified | runtime verified

  # Evidenced component locations excluded from adoption grading until their
  # ownership is established.
  component_root_candidates: [] # [{path, confidence, ownership, evidence, profiles}]

  # A registration or strong profile root whose source file is absent.
  missing_registered_roots: [] # [{path, root_type, confidence, ownership, evidence, profiles, exists:false}]

  # Routes, templates and Storybook roots guide investigation without
  # becoming product reachability by themselves.
  surface_roots: []        # [{path, root_type, scope, confidence, ownership, evidence, profiles}]

  # The schemes that have resolved or compiled output this run could read.
  # mode-completeness may only be graded pass/attention/fail when every
  # entry in `declared.modes` appears here — otherwise it is blocked, and
  # `blocked_reason` names the artifact that would unblock it.
  mode_resolution:
    audited_pairs: []      # [{bundle, mode}]
    resolved_pairs: []     # [{bundle, mode, artifact, confidence}]
    blocked_reason: null

# What this run looked at. Every value is observed, never assumed.
run:
  generated_at: null        # ISO 8601
  repo_ref: null            # git SHA, or null if not a git repo
  token_count: null
  family_count: null
  files_scanned: null       # how many files leakage actually searched
  scope: []                 # the globs or directories analyzed
  framework_versions: {}    # any framework whose defaults were consulted, and the exact version

stack:
  adapters: []              # any of: css-vars, tailwind, scss, dtcg, unknown — more than one can apply at once
  token_sources: []         # paths that define tokens
  detected_by: null         # what proved it — a filename, a config key
  confidence: null          # certain | inferred | interviewed

# What the project promises. Read from the repo, never guessed.
# A mode the project does not declare is not_applicable, never a gap.
declared:
  modes: []                 # e.g. [light, dark]
  categories: []            # the token categories this system claims
  accessibility_target: null

# Every foundational family in references/token-taxonomy.md, whether or not
# this project declares it. Three states, and they are different claims:
#   measured   — found and counted
#   unmeasured — could not be resolved; `note` says what is missing
#   absent     — the project declares no tokens for this family
# An unmeasured family reported as count 0 fails validate_run.py rule 4:
# zero states the project has none, which an unmeasured run never
# established. A missing family fails rule 5.
inventory:
  families: {}             # name -> {state, count, tiers: {primitive, semantic},
                           #          sources: [...], note}
  concepts: []             # canonical [{name, family, representations, values, sites,
                           #   definitions: [{value, site, representation, offset, identity_context}],
                           #   alias_of}]; aggregates must equal definition projections
  unclassified_count: null # concepts whose family needs review
  candidate_or_local_override_sources: [] # reachable sources excluded from canonical counts
  identity:
    typography:            # identity-critical; never render a substitute
      state: blocked       # verified | blocked
      family: null
      token: null
      confidence: unresolved
      evidence: []
      candidates: []
      specimen:            # self-contained only; never rely on fonts installed on the reader's machine
        state: blocked     # verified | blocked
        asset: null        # verified {state, family, path, format, sha256, size_bytes, declaration, url}
        note: null
      note: null
    brand_colors:          # only explicit brand names or brand/identity source sections
      state: blocked       # verified | blocked
      confidence: unresolved
      subject_namespaces: [] # [{namespace, evidence}], distinguishes product from third parties
      colors: []           # [{token, value, confidence, evidence}]
      conflicts: []        # [{token, values, evidence, reason}], visible but never swatched
      note: null

# The four questions the report answers before anything else. Question four
# carries equal weight: a summary quiet about what it could not measure
# describes a healthier system than the run established.
# The stage the system is at, derived from the eight grades — see
# references/maturity.md. Never a number.
stage:
  current: null             # scattered | declared | adopted | layered | complete | held
  next: null                # the stage the threshold below leads to, or null at held
  threshold: null           # the one thing that moves it, as a sentence
  already_met: []           # later-stage conditions the system satisfies now

# Every close call the run flagged — the reader is the tiebreak.
# Each entry: {decision, moved, other_reading, vitals: [...]}
decisions: []

executive_summary:
  highest_impact: null      # {finding_id, statement, blast_radius}
  affected: null            # {owned_files, components}
  fix_first: null           # {action, file_line, finding_id}
  confidence_split: null    # {confirmed, blocked, unmeasured, waiting_on: [...]}

# Verified fixes and review candidates with a canonical replacement, ordered
# by priority. Only entries with semantic proof may be automated.
# Each entry:
#   {id, tier, family, literal, replacement, locations: ["path:line"],
#    occurrences, files, breadth, confidence, semantic_role_verified,
#    safe_to_automate,
#    effort: S | M | L,
#    priority: {occurrences, files, breadth, confidence, confidence_weight,
#               formula, score}}
# effort: S automatable under ten files; M automatable across more, or one
#         file needing a call; L needs a decision first. Derived, never hours.
# confidence: exact static match | import-graph verified |
#             compiled-runtime verified | manual review
# safe_to_automate may only be true for the redundant tier when
# semantic_role_verified is true and confidence is not manual review —
# validate_run.py rule 7.
fix_queue: []

# The same findings, grouped so an engineer can start from what they own.
# Every finding appears in the value view and in an owner view.
groups:
  by_value: []              # [{key, finding_ids, occurrences, files}]
  by_component: []          # [{name, path, finding_ids, occurrences, files, priority}]
  by_plugin: []             # [{name, path, finding_ids, occurrences, files, priority}]
  by_route: []              # [{name, bundle, finding_ids, occurrences, files, priority}]

# A ranked adoption view produced by tools/analyze_component_usage.py.
# Every Top 20 entry is rendered in HTML with every token and location.
component_usage:
  state: null               # measured | unmeasured | blocked
  component_definition: null
  rank_by: null
  files_scanned: null
  total_usage_units: null
  total_components_with_token_usage: null
  additional_style_surfaces: null
  shown: null
  shown_components: null
  fallback_surfaces: null
  not_shown: null
  measurement: []           # [{syntax, state, evidence}]
  roadmap:                  # deterministic cumulative-use bands for roadmap planning
    state: null             # measured
    basis: null             # what the ordering proves and does not prove
    ranked_references: null # denominator for the visible ranked view
    bands: []               # [{id, label, description, start_rank, end_rank,
                            #   component_ids, references,
                            #   share_of_ranked_references}]
  top_20: []                # [{id, rank, key, name, kind, confidence, paths,
                            #   references, distinct_tokens, families,
                            #   share_of_ranked_references,
                            #   cumulative_share_of_ranked_references,
                            #   roadmap_band,
                            #   syntaxes, tokens: [{id, family, references,
                            #                       syntaxes, locations: ["path:line"]}]}]

# primitive definition -> semantic alias -> projection -> consumer usage.
# A lineage edge is what separates an intentional alias from a duplicate
# definition. Record where a chain could not be completed rather than
# inferring the missing link.
lineage: []                 # [{token, primitive, semantic, projection,
                            #   consumers: [...], complete: bool, note}]

# entry bundle x theme/mode x token family. Every cell carries a state and
# its evidence, so a gap in what the run could see reads as a shape.
coverage_matrix:
  bundles: []               # the entry bundles on the first axis
  modes: []                 # the themes or modes on the second axis
  families: []              # the token families on the third
  cells: []                 # [{bundle, mode, family, state, evidence, note}]
                            # state: measured | unmeasured | not_applicable | blocked

# Evidence-derived recommendation for unifying design decisions without
# claiming that a token audit proved component behavior. Rendered as the last
# report section; see references/adoption-strategy.md.
adoption_strategy:
  schema_version: 1
  model: null               # token-led-hybrid | token-first-foundation
  confidence: null          # evidence-derived | bounded-by-discovery
  headline: null
  rationale: null
  evidence:                 # exact facts used to choose the model
    profiles: []
    adapters: []
    production_roots: null
    owned_roots: null
    confirmed_token_definition_sources: null
    canonical_concepts: null
    component_usage_state: null
    components_with_token_usage: null
    declared_modes: []
    resolved_mode_pairs: null
    unresolved_imports: null
    capabilities: {}
  target_architecture: []   # [{id, title, description}]
  integration_constraints: [] # five ordered [{id, title, evidence, implication}]
  standards: []             # [{id, name, url, role}]
  rollout: []               # six ordered [{id, phase, title, objective,
                            #               evidence, exit_criteria}]
  guardrails: []
  success_metrics: []       # [{id, measure, baseline, target}]
  component_replacement_limit: null

# Filled by tools/trend.py against an explicitly passed baseline. The skill
# never writes a baseline into the repository it audits.
trend:
  baseline_ref: null        # the commit the baseline came from
  compatible: null          # false when scope, adapter or sources diverged
  new: []
  resolved: []
  grew: []
  shrank: []
  regressions: []

vitals:
  tier-integrity: { grade: null, evidence: [], note: null }
  leakage: { grade: null, evidence: [], note: null, tiers: { "redundant": 0, "exact-value candidate": 0, "near-miss": 0, "uncovered": 0 } }
  coverage: { grade: null, evidence: [], note: null }
  mode-completeness: { grade: null, evidence: [], note: null }
  naming-coherence: { grade: null, evidence: [], note: null }
  single-source: { grade: null, evidence: [], note: null }
  orphans: { grade: null, evidence: [], note: null }
  enforcement: { grade: null, evidence: [], note: null }

# grade: pass | attention | fail | blocked | not_applicable
# evidence: a list of "path:line" strings. A grade with an empty
#           evidence list must be a clean pass or blocked, never fail.
# note:     why, when the grade is blocked or not_applicable, or when
#           pass carries no evidence because nothing was found.

rendering:
  view: snapshot             # snapshot | action | evidence; initial presentation only
  available_views:           # fixed order; every view uses this run's complete evidence
    - snapshot
    - action
    - evidence
  tier: null                # full | collapsed | family-only

  # The mark each listing section was rendered with, chosen in Stage 5 from
  # that section's own finding count — see the form table in
  # references/report.md. The view, tier, and forms are recorded so two runs
  # can be compared on presentation as well as on findings.
  forms:
    color: null             # rows | swatches | ramps
    typography: null        # rows | specimens
    spacing: null           # rows | bars
    leaks: null             # rows | grouped | distribution
    orphans: null           # rows | chips | by-family
    modes: null             # matrix | coverage-bar
    families: null          # rows | health-strip | by-namespace

  # Every section that held part of its findings behind a <details>, with
  # what that remainder holds — never only how many. A truncation rendered
  # in the HTML and missing here fails validate_run.py rule 6.
  # Each entry: {section, shown, withheld, summary}
  truncated: []
