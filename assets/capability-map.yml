schema_version: 2

# Provenance for a follow-on agent: everything needed to know what this run
# was, and whether another run is comparable to it. Required in the JSON
# and in the report's measurement section.
provenance:
  report_schema_version: 2
  skill_version: null       # the skill's released version or commit
  adapter_versions: {}      # adapter name -> version or commit
  generated_at: null        # ISO 8601
  repo_ref: null            # commit ref of the audited repository

# What owns theming, and what the project actually authored. Read from
# the repository in Stage 1, before anything below this block is graded —
# see references/discovery.md.
discovery:
  environment: null        # discourse | nextjs | tailwind | rails-sprockets | vite | monorepo | unknown
  detected_by: null        # the file or signal that proved it
  confidence: null         # certain | inferred | interviewed
  evidence: []             # each entry: {kind, path, matched} — kind is manifest |
                           # build-config | lockfile | asset-registration | entry-point |
                           # template | theme-structure | extension
  owned_paths: []          # what the project authored
  excluded_paths: []       # each entry: {path, reason}

  # Every candidate found in job two, after job three proved reachability
  # and job four classified it. The token count counts concepts, so a
  # projection pair (a SCSS variable and the custom property it emits) is
  # one entry with both sites recorded in `sites`.
  # Each entry:
  #   {path, classification, reachable_from: [...], sites: [...],
  #    alias_of: <path|null>, matched: <what identified it>}
  # classification: canonical | alias | consumer | generated | unverified
  # A canonical or alias source with an empty reachable_from fails
  # validate_run.py rule 2 — it was inventoried without proof that it ships.
  token_sources: []

  # The output of tools/import_graph.py, carried into the report as
  # evidence. Roots are the owned production entry points; orphans are
  # stylesheets no root reaches.
  import_graph:
    roots: []              # each entry: {path, detected_by}
    reachable: {}          # path -> {depth, via: [...]}
    unresolved: []         # each entry: {from, spec, reason}
    orphans: []            # stylesheets no owned entry point reaches

  # The schemes that have resolved or compiled output this run could read.
  # mode-completeness may only be graded pass/attention/fail when every
  # entry in `declared.modes` appears here — otherwise it is blocked, and
  # `blocked_reason` names the artifact that would unblock it.
  resolved_modes: []
  modes_blocked_reason: null

# What this run looked at. Every value is observed, never assumed.
run:
  generated_at: null        # ISO 8601
  repo_ref: null            # git SHA, or null if not a git repo
  token_count: null
  family_count: null
  files_scanned: null       # how many files leakage actually searched
  scope: []                 # the globs or directories analyzed
  framework_versions: {}    # any framework whose defaults were consulted, and the exact version

stack:
  adapters: []              # any of: css-vars, tailwind, scss, dtcg, unknown — more than one can apply at once
  token_sources: []         # paths that define tokens
  detected_by: null         # what proved it — a filename, a config key
  confidence: null          # certain | inferred | interviewed

# What the project promises. Read from the repo, never guessed.
# A mode the project does not declare is not_applicable, never a gap.
declared:
  modes: []                 # e.g. [light, dark]
  categories: []            # the token categories this system claims
  accessibility_target: null

# Every foundational family in references/token-taxonomy.md, whether or not
# this project declares it. Three states, and they are different claims:
#   measured   — found and counted
#   unmeasured — could not be resolved; `note` says what is missing
#   absent     — the project declares no tokens for this family
# An unmeasured family reported as count 0 fails validate_run.py rule 4:
# zero states the project has none, which an unmeasured run never
# established. A missing family fails rule 5.
inventory:
  families: {}             # name -> {state, count, tiers: {primitive, semantic},
                           #          sources: [...], note}

# The four questions the report answers before anything else. Question four
# carries equal weight: a summary quiet about what it could not measure
# describes a healthier system than the run established.
executive_summary:
  highest_impact: null      # {finding_id, statement, blast_radius}
  affected: null            # {owned_files, components}
  fix_first: null           # {action, file_line, finding_id}
  confidence_split: null    # {confirmed, blocked, unmeasured, waiting_on: [...]}

# Every finding safe enough to act on mechanically, ordered by priority.
# Each entry:
#   {id, tier, family, literal, replacement, locations: ["path:line"],
#    occurrences, files, breadth, confidence, safe_to_automate,
#    priority: {occurrences, files, breadth, confidence, confidence_weight,
#               formula, score}}
# confidence: exact static match | import-graph verified |
#             compiled-runtime verified | manual review
# safe_to_automate may only be true for the redundant tier at a confidence
# other than manual review — validate_run.py rule 7.
fix_queue: []

# The same findings, grouped so an engineer can start from what they own.
# Every finding appears in the value view and in an owner view.
groups:
  by_value: []              # [{key, finding_ids, occurrences, files}]
  by_component: []          # [{name, path, finding_ids, occurrences, files, priority}]
  by_plugin: []             # [{name, path, finding_ids, occurrences, files, priority}]
  by_route: []              # [{name, bundle, finding_ids, occurrences, files, priority}]

# primitive definition -> semantic alias -> projection -> consumer usage.
# A lineage edge is what separates an intentional alias from a duplicate
# definition. Record where a chain could not be completed rather than
# inferring the missing link.
lineage: []                 # [{token, primitive, semantic, projection,
                            #   consumers: [...], complete: bool, note}]

# entry bundle x theme/mode x token family. Every cell carries a state and
# its evidence, so a gap in what the run could see reads as a shape.
coverage_matrix:
  bundles: []               # the entry bundles on the first axis
  modes: []                 # the themes or modes on the second axis
  families: []              # the token families on the third
  cells: []                 # [{bundle, mode, family, state, evidence, note}]
                            # state: measured | unmeasured | not_applicable | blocked

# Filled by tools/trend.py against an explicitly passed baseline. The skill
# never writes a baseline into the repository it audits.
trend:
  baseline_ref: null        # the commit the baseline came from
  compatible: null          # false when scope, adapter or sources diverged
  new: []
  resolved: []
  grew: []
  shrank: []
  regressions: []

vitals:
  tier-integrity: { grade: null, evidence: [], note: null }
  leakage: { grade: null, evidence: [], note: null, tiers: { "redundant": 0, "near-miss": 0, "uncovered": 0 } }
  coverage: { grade: null, evidence: [], note: null }
  mode-completeness: { grade: null, evidence: [], note: null }
  naming-coherence: { grade: null, evidence: [], note: null }
  single-source: { grade: null, evidence: [], note: null }
  orphans: { grade: null, evidence: [], note: null }
  enforcement: { grade: null, evidence: [], note: null }

# grade: pass | attention | fail | blocked | not_applicable
# evidence: a list of "path:line" strings. A grade with an empty
#           evidence list must be a clean pass or blocked, never fail.
# note:     why, when the grade is blocked or not_applicable, or when
#           pass carries no evidence because nothing was found.

rendering:
  tier: null                # full | collapsed | family-only

  # The mark each listing section was rendered with, chosen in Stage 5 from
  # that section's own finding count — see the form table in
  # references/report.md. Recorded so two runs can be compared on
  # presentation as well as on findings.
  forms:
    color: null             # rows | swatches | ramps
    typography: null        # rows | specimens
    spacing: null           # rows | bars
    leaks: null             # rows | grouped | distribution
    orphans: null           # rows | chips | by-family
    modes: null             # matrix | coverage-bar
    families: null          # rows | health-strip | by-namespace

  # Every section that held part of its findings behind a <details>, with
  # what that remainder holds — never only how many. A truncation rendered
  # in the HTML and missing here fails validate_run.py rule 6.
  # Each entry: {section, shown, withheld, summary}
  truncated: []
